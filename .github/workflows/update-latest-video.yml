name: Update Latest YouTube Video

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-latest-youtube-video
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check YouTube for a new video
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/updateLatestVideo.js

      - name: Commit updated latest video
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/data/latestVideo.json; then
            echo "No latest-video change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- frontend/src/data/latestVideo.json
          git commit -m "Update latest YouTube video"
          git push
